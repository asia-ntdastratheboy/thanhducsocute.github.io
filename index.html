<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Đức | Pro5</title>
    <!-- Nhúng font chữ đẹp -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: #0f0f13;
            background-image: radial-gradient(circle at 50% 0%, #2a2a35 0%, #0f0f13 70%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Khung kính mờ */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 24px;
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            max-width: 360px;
            width: 100%;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
        }

        /* Ảnh đại diện */
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            /* Thay link ảnh của bạn vào đây (giữa 2 dấu ngoặc kép) */
            background-image: url('https://i.pinimg.com/736x/8d/6e/4b/8d6e4b0a9e2e3b1e8f6c6b1b1b1b1b1b.jpg'); 
            background-size: cover;
            background-position: center;
            margin: 0 auto 20px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
        }

        h1 { 
            font-size: 24px; 
            font-weight: 700; 
            letter-spacing: -0.5px; 
            margin-bottom: 8px;
        }

        p { 
            color: #9ca3af; 
            font-size: 14px; 
            font-weight: 300;
            line-height: 1.5;
            margin-bottom: 30px; 
        }

        /* Các nút bấm */
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .links a {
            display: block;
            background: rgba(255, 255, 255, 0.05);
            color: #e5e7eb;
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
        }

        .links a:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="avatar"></div>
        <h1>Thanh Đức</h1>
        <p>Chào mừng đến với không gian của mình.<br>Kết nối với mình qua các nền tảng dưới đây.</p>
        
        <div class="links">
            <a href="https://facebook.com" target="_blank">Facebook</a>
            <a href="https://instagram.com" target="_blank">Instagram</a>
            <a href="https://discord.com" target="_blank">Discord</a>
        </div>
    </div>

</body>
</html>
