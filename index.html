<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang cá nhân của Thanh Đức</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #2a2a2a;
            padding: 40px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 300px;
            width: 90%;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #555;
            margin: 0 auto 20px;
        }
        h1 { margin: 10px 0; font-size: 24px; }
        p { color: #aaa; font-size: 14px; margin-bottom: 30px; }
        .links a {
            display: block;
            background: #e91e63;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: 0.3s;
        }
        .links a:hover { background: #c2185b; }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar"></div>
        <h1>Thanh Đức</h1>
        <p>Chào mừng đến với pro5 của mình!</p>
        <div class="links">
            <a href="https://facebook.com" target="_blank">Facebook</a>
            <a href="https://instagram.com" target="_blank">Instagram</a>
            <a href="https://discord.com" target="_blank">Discord</a>
        </div>
    </div>
</body>
</html>
